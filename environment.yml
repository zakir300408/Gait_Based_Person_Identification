name: gaitprint
channels:
  - conda-forge
dependencies:
  - python=3.10.18
  - numpy=2.2.6
  - scipy=1.15.3
  - scikit-learn=1.5.2
  - pandas=2.3.3
  - h5py=3.13.0
  - matplotlib=3.8.4
  - joblib=1.5.0
  - threadpoolctl=3.6.0
  - pip
  - pip:
      - sktime==0.39.0
      - numba==0.62.1
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.7.1+cu128
      - PyMuPDF==1.28.0
